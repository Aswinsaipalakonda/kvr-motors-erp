{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | KVR Motors Admin{% endblock %}

{% block branding %}
<div id="site-name" style="display: flex; items-center: center; gap: 10px;">
    <h1 style="margin: 0; font-size: 20px; font-weight: bold; text-transform: uppercase; tracking-wider; display: flex; align-items: center; gap: 10px;">
        <span style="display: inline-block; width: 8px; height: 18px; bg-color: #38bdf8; background: #38bdf8; border-radius: 2px;"></span>
        KVR Motors Admin Portal
    </h1>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Premium Modern Re-styling of Django Admin to match mockups */
    :root {
        --primary: #0284c7 !important;
        --primary-fg: #ffffff !important;
        --body-bg: #f8fafc !important;
        --body-fg: #0f172a !important;
        --header-bg: #0c1e35 !important;
        --header-color: #fafafa !important;
        --header-link-color: #94a3b8 !important;
        --breadcrumbs-bg: #ffffff !important;
        --breadcrumbs-link-color: #0284c7 !important;
        --breadcrumbs-fg: #64748b !important;
        --sidebar-bg: #0c1e35 !important;
        --link-color: #0284c7 !important;
        --link-hover-color: #0369a1 !important;
        --button-bg: #0284c7 !important;
        --button-hover-bg: #0369a1 !important;
    }

    /* Core Layout and Typography styling */
    body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        background-color: #f8fafc !important;
        color: #0f172a !important;
    }

    #header {
        background: #0c1e35 !important;
        color: #fafafa !important;
        border-bottom: 1px solid #1e293b !important;
        padding: 15px 30px !important;
    }

    #header a:link, #header a:visited {
        color: #94a3b8 !important;
        font-weight: 500 !important;
        transition: color 0.2s ease;
    }

    #header a:hover {
        color: #ffffff !important;
    }

    /* Branding Site Title */
    #branding h1 {
        color: #ffffff !important;
        font-size: 18px !important;
        letter-spacing: 0.05em !important;
    }

    /* Breadcrumbs styling */
    .breadcrumbs {
        background: #ffffff !important;
        border-bottom: 1px solid #e2e8f0 !important;
        padding: 12px 30px !important;
        color: #64748b !important;
        font-size: 13px !important;
    }

    .breadcrumbs a {
        color: #0284c7 !important;
        font-weight: 500 !important;
    }

    /* Left Sidebar Re-styling to match premium Dark Sidebar Mockup */
    #nav-sidebar {
        background-color: #0c1e35 !important;
        border-right: 1px solid #1e293b !important;
        flex: 0 0 260px !important;
    }

    .nav-sidebar-section {
        border-bottom: 1px solid #1e293b/30 !important;
        padding: 10px 0 !important;
    }

    .nav-sidebar-section a {
        color: #94a3b8 !important;
        font-size: 13px !important;
        padding: 8px 20px !important;
        display: block !important;
        transition: all 0.2s ease !important;
    }

    .nav-sidebar-section a:hover, .nav-sidebar-section th a:hover {
        background-color: #1e293b/50 !important;
        color: #ffffff !important;
    }

    .nav-sidebar-section tr.active a {
        background-color: #0284c7 !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        border-left: 4px solid #38bdf8 !important;
    }

    .nav-sidebar-section caption {
        background: transparent !important;
        color: #64748b !important;
        font-size: 10px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.1em !important;
        padding: 10px 20px !important;
    }

    /* Module lists & tables inside admin main area */
    div.content {
        padding: 30px !important;
    }

    .module {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 12px !important;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
        margin-bottom: 25px !important;
        overflow: hidden !important;
    }

    .module caption, .inline-group h2 {
        background: #f8fafc !important;
        border-bottom: 1px solid #e2e8f0 !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        padding: 15px 20px !important;
        text-align: left !important;
    }

    /* Table listing rows styling */
    #changelist table {
        border-collapse: collapse !important;
        width: 100% !important;
    }

    #changelist table thead th {
        background: #f8fafc !important;
        border-bottom: 1px solid #e2e8f0 !important;
        color: #64748b !important;
        font-weight: 700 !important;
        font-size: 12px !important;
        padding: 12px 20px !important;
    }

    #changelist table tbody td, #changelist table tbody th {
        padding: 12px 20px !important;
        font-size: 13px !important;
        border-bottom: 1px solid #f1f5f9 !important;
    }

    /* Add/Change Buttons Re-styling */
    .submit-row input, a.addlink, .button, input[type=submit] {
        background: #0284c7 !important;
        border: none !important;
        border-radius: 8px !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        font-size: 12px !important;
        padding: 10px 18px !important;
        cursor: pointer !important;
        transition: background 0.2s ease !important;
    }

    .submit-row input:hover, a.addlink:hover, .button:hover, input[type=submit]:hover {
        background: #0369a1 !important;
    }

    .submit-row input.default {
        background: #0284c7 !important;
        box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2) !important;
    }

    .submit-row input.default:hover {
        background: #0369a1 !important;
    }

    /* Search Bar and filter styles */
    #searchbar {
        border: 1px solid #cbd5e1 !important;
        border-radius: 8px !important;
        padding: 8px 12px !important;
        font-size: 13px !important;
        outline: none !important;
        transition: border 0.2s ease !important;
    }

    #searchbar:focus {
        border-color: #0284c7 !important;
    }

    #changelist-filter {
        background: #ffffff !important;
        border-left: 1px solid #e2e8f0 !important;
        flex: 0 0 240px !important;
    }

    #changelist-filter h2 {
        background: #f8fafc !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        font-size: 13px !important;
        border-bottom: 1px solid #e2e8f0 !important;
        padding: 15px 20px !important;
    }
</style>
{% endblock %}
