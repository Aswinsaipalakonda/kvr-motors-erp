version: '3.9'

services:
  db:
    image: postgres:16
    container_name: kvr_postgres
    restart: always
    environment:
      POSTGRES_DB: kvr_motors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kvr_backend
    restart: always
    ports:
      - "8004:8000"
    environment:
      - POSTGRES_DB=kvr_motors
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-kvr-motors-key-2026
    depends_on:
      - db
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media

  frontend:
    build:
      context: ./dashboards
      dockerfile: Dockerfile
    container_name: kvr_frontend
    restart: always
    ports:
      - "3004:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
